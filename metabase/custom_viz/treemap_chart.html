<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>SONEDE - Treemap Hiérarchique des Réclamations</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 15px; background: #ffffff; }
    h2 { color: #1e293b; font-size: 18px; margin-bottom: 12px; }
    #treemap { width: 100%; height: 520px; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .node { font-size: 11px; overflow: hidden; position: absolute; text-indent: 4px; line-height: 1.4; color: white; cursor: pointer; transition: filter 0.2s; }
    .node:hover { filter: brightness(1.15); }
    .node-label { font-weight: bold; margin-top: 4px; }
    .node-value { font-size: 10px; opacity: 0.9; }
  </style>
</head>
<body>
  <h2>🌳 Hiérarchie: Région (Gouvernorat) → Type de Problème → Urgence</h2>
  <div id="treemap"></div>

  <script>
    const data = {
      name: "SONEDE",
      children: [
        {
          name: "Sfax",
          children: [
            { name: "Qualité de l'eau (Critique)", value: 18 },
            { name: "Pression faible (Haute)", value: 14 },
            { name: "Coupure non signalée (Moyenne)", value: 12 },
            { name: "Litige facturation (Faible)", value: 6 }
          ]
        },
        {
          name: "Tunis",
          children: [
            { name: "Coupure non signalée (Critique)", value: 15 },
            { name: "Fuite visible (Haute)", value: 12 },
            { name: "Retard intervention (Moyenne)", value: 8 }
          ]
        },
        {
          name: "Kairouan",
          children: [
            { name: "Coupure annoncée / rationnement (Critique)", value: 14 },
            { name: "Qualité de l'eau (Haute)", value: 9 },
            { name: "Panne de pompage (Haute)", value: 6 }
          ]
        },
        {
          name: "Gafsa",
          children: [
            { name: "Coupure non signalée (Critique)", value: 16 },
            { name: "Panne de pompage (Critique)", value: 10 }
          ]
        },
        {
          name: "Jendouba",
          children: [
            { name: "Fuite visible (Critique)", value: 12 },
            { name: "Coupure non signalée (Haute)", value: 10 }
          ]
        },
        {
          name: "Nabeul",
          children: [
            { name: "Coupure non signalée (Haute)", value: 10 },
            { name: "Litige facturation (Faible)", value: 8 }
          ]
        }
      ]
    };

    const width = document.getElementById('treemap').clientWidth;
    const height = 520;

    const color = d3.scaleOrdinal()
      .domain(["Sfax", "Tunis", "Kairouan", "Gafsa", "Jendouba", "Nabeul"])
      .range(["#0284c7", "#0d9488", "#d97706", "#dc2626", "#7c3aed", "#2563eb"]);

    const root = d3.hierarchy(data)
      .sum(d => d.value)
      .sort((a, b) => b.value - a.value);

    d3.treemap()
      .size([width, height])
      .paddingInner(3)
      (root);

    const treemapDiv = d3.select("#treemap").style("position", "relative");

    treemapDiv.selectAll(".node")
      .data(root.leaves())
      .enter().append("div")
      .attr("class", "node")
      .style("left", d => d.x0 + "px")
      .style("top", d => d.y0 + "px")
      .style("width", d => Math.max(0, d.x1 - d.x0) + "px")
      .style("height", d => Math.max(0, d.y1 - d.y0) + "px")
      .style("background", d => color(d.parent.data.name))
      .html(d => `
        <div class="node-label">${d.parent.data.name}</div>
        <div>${d.data.name}</div>
        <div class="node-value">${d.data.value} cas</div>
      `);
  </script>
</body>
</html>
