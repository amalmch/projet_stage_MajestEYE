<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SONEDE - Gestion des Utilisateurs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #070d17;
      --card-bg: #0d1526;
      --card-border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #0284c7;
      --primary-light: rgba(2, 132, 199, 0.15);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --item-bg: #080e1a;
      --input-bg: #080e1a;
      --row-hover: rgba(30, 41, 59, 0.5);
    }
    [data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-light: rgba(2, 132, 199, 0.08);
      --item-bg: #f8fafc;
      --input-bg: #f8fafc;
      --row-hover: #f1f5f9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 28px;
      transition: background 0.3s, color 0.3s;
      min-height: 100vh;
    }

    /* Header */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .section-title h2 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }
    .section-title p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* KPI Summary Row */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .kpi-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px 18px;
      text-align: center;
    }
    .kpi-card .val { font-size: 22px; font-weight: 800; }
    .kpi-card .lbl { font-size: 11.5px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; margin-top: 4px; }

    /* Layout Grid */
    .layout-grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 24px;
      align-items: start;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .form-group input, .form-group select {
      width: 100%;
      background: var(--input-bg);
      border: 1.5px solid var(--card-border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary);
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      margin-top: 8px;
      transition: all 0.2s;
    }
    .submit-btn:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    /* Filter Pills */
    .filter-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .filter-tab {
      background: var(--item-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .filter-tab.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Users List */
    .users-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: calc(100vh - 280px);
      overflow-y: auto;
      padding-right: 4px;
    }
    .user-card {
      background: var(--item-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.2s;
    }
    .user-card:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
    }

    .u-main {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .u-avatar {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      color: white;
      flex-shrink: 0;
    }
    .u-name { font-size: 14px; font-weight: 700; }
    .u-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .role-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .role-admin { background: rgba(139, 92, 246, 0.15); color: #c084fc; border: 1px solid rgba(139, 92, 246, 0.3); }
    .role-tech { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .role-citizen { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }

    .del-btn {
      background: transparent;
      border: 1px solid var(--card-border);
      color: #f87171;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .del-btn:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: #ef4444;
    }

    @media (max-width: 1024px) {
      .layout-grid { grid-template-columns: 1fr; }
      .kpi-row { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="section-header">
    <div class="section-title">
      <h2>👥 Gestion des Utilisateurs & Rôles</h2>
      <p>Créez, modifiez et supervisez les comptes administrateurs, techniciens et citoyens</p>
    </div>
  </div>

  <!-- KPI Row -->
  <div class="kpi-row">
    <div class="kpi-card">
      <div class="val" id="cntTotal" style="color: var(--primary);">0</div>
      <div class="lbl">Total Utilisateurs</div>
    </div>
    <div class="kpi-card">
      <div class="val" id="cntTechs" style="color: #fbbf24;">0</div>
      <div class="lbl">Techniciens</div>
    </div>
    <div class="kpi-card">
      <div class="val" id="cntAdmins" style="color: #c084fc;">0</div>
      <div class="lbl">Administrateurs</div>
    </div>
    <div class="kpi-card">
      <div class="val" id="cntCitizens" style="color: #38bdf8;">0</div>
      <div class="lbl">Citoyens</div>
    </div>
  </div>

  <!-- Layout -->
  <div class="layout-grid">
    <!-- Left Column: Create User Form -->
    <div class="card">
      <div class="card-title">➕ Ajouter un Utilisateur / Staff</div>

      <div class="form-group">
        <label>Nom complet *</label>
        <input id="uFullName" type="text" placeholder="Ex: Sami Trabelsi" required>
      </div>

      <div class="form-group">
        <label>Email professionnel *</label>
        <input id="uEmail" type="email" placeholder="tech.sousse@sonede.tn" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Mot de passe *</label>
          <input id="uPassword" type="password" placeholder="••••••••" required>
        </div>
        <div class="form-group">
          <label>Rôle *</label>
          <select id="uRole">
            <option value="TECHNICIEN">Technicien</option>
            <option value="ADMIN">Administrateur</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Gouvernorat</label>
          <select id="uGov">
            <option value="Tunis">Tunis</option>
            <option value="Ariana">Ariana</option>
            <option value="Ben Arous">Ben Arous</option>
            <option value="Manouba">Manouba</option>
            <option value="Nabeul">Nabeul</option>
            <option value="Bizerte">Bizerte</option>
            <option value="Béja">Béja</option>
            <option value="Jendouba">Jendouba</option>
            <option value="Sousse">Sousse</option>
            <option value="Sfax">Sfax</option>
          </select>
        </div>
        <div class="form-group">
          <label>Délégation</label>
          <input id="uDel" type="text" placeholder="Ex: El Menzah">
        </div>
      </div>

      <div class="form-group">
        <label>Téléphone</label>
        <input id="uPhone" type="text" placeholder="+216 71 000 000">
      </div>

      <button class="submit-btn" onclick="createUser()">Créer l'utilisateur</button>
    </div>

    <!-- Right Column: Users List -->
    <div class="card">
      <div class="card-title">📋 Répertoire des Comptes Actifs</div>

      <div class="filter-tabs">
        <button class="filter-tab active" onclick="filterRole('ALL', this)">Tous</button>
        <button class="filter-tab" onclick="filterRole('TECHNICIEN', this)">Techniciens</button>
        <button class="filter-tab" onclick="filterRole('ADMIN', this)">Admins</button>
        <button class="filter-tab" onclick="filterRole('CITIZEN', this)">Citoyens</button>
      </div>

      <div class="users-list" id="usersList">
        <div style="text-align:center; padding:30px; color: var(--text-muted);">Chargement...</div>
      </div>
    </div>
  </div>

  <script>
    // Theme sync
    function syncTheme() {
      const saved = localStorage.getItem('sonede_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
    }
    syncTheme();
    window.addEventListener('storage', syncTheme);

    let allUsers = [];
    let activeFilter = 'ALL';

    async function loadUsers() {
      try {
        const r = await fetch('/users');
        const data = await r.json();
        allUsers = Array.isArray(data) ? data : (data.results || data.users || []);
        updateCounts();
        renderList();
      } catch(e) {
        document.getElementById('usersList').innerHTML = '<div style="text-align:center; padding:20px; color:#f87171;">Erreur de chargement.</div>';
      }
    }

    function updateCounts() {
      let t = 0, a = 0, c = 0;
      allUsers.forEach(u => {
        const role = (u.role || '').toUpperCase();
        if (role === 'TECHNICIEN') t++;
        else if (role === 'ADMIN') a++;
        else c++;
      });
      document.getElementById('cntTotal').textContent = allUsers.length;
      document.getElementById('cntTechs').textContent = t;
      document.getElementById('cntAdmins').textContent = a;
      document.getElementById('cntCitizens').textContent = c;
    }

    function filterRole(role, btn) {
      activeFilter = role;
      document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderList();
    }

    function renderList() {
      const container = document.getElementById('usersList');
      let filtered = allUsers.filter(u => {
        if (activeFilter === 'ALL') return true;
        return (u.role || 'CITIZEN').toUpperCase() === activeFilter;
      });

      if (!filtered.length) {
        container.innerHTML = '<div style="text-align:center; padding:30px; color: var(--text-muted);">Aucun utilisateur trouvé.</div>';
        return;
      }

      container.innerHTML = filtered.map(u => {
        const role = (u.role || 'CITIZEN').toUpperCase();
        let roleBadge = 'role-citizen';
        let bgAvatar = 'linear-gradient(135deg, #0284c7, #0369a1)';

        if (role === 'ADMIN') {
          roleBadge = 'role-admin';
          bgAvatar = 'linear-gradient(135deg, #8b5cf6, #6d28d9)';
        } else if (role === 'TECHNICIEN') {
          roleBadge = 'role-tech';
          bgAvatar = 'linear-gradient(135deg, #f59e0b, #d97706)';
        }

        const name = u.fullName || u.email || 'Utilisateur';
        const initials = name.split(' ').map(n => n[0]).slice(0,2).join('').toUpperCase();
        const loc = u.governorate ? `📍 ${u.governorate}` : '';
        const phone = u.phone ? `📞 ${u.phone}` : '';

        return `
          <div class="user-card">
            <div class="u-main">
              <div class="u-avatar" style="background:${bgAvatar};">${initials}</div>
              <div>
                <div class="u-name">${name}</div>
                <div class="u-sub">${u.email} ${loc ? '• ' + loc : ''} ${phone ? '• ' + phone : ''}</div>
              </div>
            </div>
            <div style="display:flex; align-items:center; gap:12px;">
              <span class="role-badge ${roleBadge}">${role}</span>
              <button class="del-btn" onclick="deleteUser('${u.email}')" title="Supprimer">🗑️</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function createUser() {
      const fullName = document.getElementById('uFullName').value.trim();
      const email = document.getElementById('uEmail').value.trim();
      const password = document.getElementById('uPassword').value;
      const role = document.getElementById('uRole').value;
      const governorate = document.getElementById('uGov').value;
      const delegation = document.getElementById('uDel').value.trim();
      const phone = document.getElementById('uPhone').value.trim();

      if (!fullName || !email || !password) {
        alert('Veuillez remplir le nom, email et mot de passe');
        return;
      }

      try {
        const r = await fetch('/users/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fullName, email, password, role, governorate, delegation, phone })
        });
        const res = await r.json();
        if (res.error) alert(res.error);
        else {
          document.getElementById('uFullName').value = '';
          document.getElementById('uEmail').value = '';
          document.getElementById('uPassword').value = '';
          loadUsers();
        }
      } catch(e) {
        alert('Erreur lors de la création');
      }
    }

    async function deleteUser(email) {
      if (!confirm(`Supprimer l'utilisateur ${email} ?`)) return;
      try {
        await fetch(`/users/delete?email=${encodeURIComponent(email)}`, { method: 'DELETE' });
        loadUsers();
      } catch(e) {}
    }

    loadUsers();
  </script>
</body>
</html>
